name: Internal Release

# One workflow for both SDKs' internal (dev) releases. The release branch decides the product:
#   release/*            -> legacy (skyvault)
#   flowvault-release/*  -> flowvault
on:
  push:
    tags-ignore:
      - "*"
    paths-ignore:
      - "skyvault/build.gradle"
      - "flowvault/build.gradle"
      - "*.md"
    branches:
      - release/*
      - flowvault-release/*

jobs:
  publish:
    name: Internal Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_ACTIONS }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Determine product and base version
        id: prod
        run: |
          git fetch --tags
          ref="${GITHUB_REF_NAME}"
          if [[ "$ref" == flowvault-release/* ]]; then
            product=flowvault; module=flowvault; gradle_file=flowvault/build.gradle; label="FlowVault Private"
            rawtag=$(git tag --list 'flowvault/[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
            tag="${rawtag#flowvault/}"; [ -z "$tag" ] && tag="1.0.0"
          else
            product=legacy;    module=skyvault;  gradle_file=skyvault/build.gradle;  label="Private"
            tag=$(git describe --tags --abbrev=0 origin/main)
          fi
          {
            echo "product=$product"
            echo "module=$module"
            echo "gradle_file=$gradle_file"
            echo "label=$label"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"
          echo "Internal release on '$ref' -> product=$product base=$tag"

      - name: Cache Gradle and wrapper
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}

      - name: Bump Version
        run: |
          chmod +x ./scripts/bump_version.sh
          ./scripts/bump_version.sh ${{ steps.prod.outputs.product }} "${{ steps.prod.outputs.tag }}" "$(git rev-parse --short "$GITHUB_SHA")"

      - name: Commit changes
        run: |
          git config user.name ${{ github.actor }}
          git config user.email ${{ github.actor }}@users.noreply.gihub.com
          git add ${{ steps.prod.outputs.gradle_file }}
          git commit -m "[AUTOMATED] ${{ steps.prod.outputs.label }} Release ${{ steps.prod.outputs.tag }}-dev.$(git rev-parse --short $GITHUB_SHA)"
          git push origin

      - name: Validate Gradle wrapper
        uses: gradle/wrapper-validation-action@v3
      - name: Publish package
        run: |
          chmod +x gradlew
          ./gradlew :${{ steps.prod.outputs.module }}:publish -Pdev=true
        env:
          USERNAME: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
