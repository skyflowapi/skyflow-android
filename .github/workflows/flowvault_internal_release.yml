name: FlowVault Internal Release
on:
  push:
    tags-ignore:
      - "*"
    paths-ignore:
      - "flowvault/build.gradle"
      - "*.md"
    branches:
      - flowvault-release/*

jobs:
  publish:
    name: FlowVault Internal Release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_ACTIONS }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Get Previous tag
        id: previoustag
        run: |
          git fetch --tags
          # Latest FlowVault stable tag (namespaced flowvault/x.y.z); strip the prefix.
          rawtag=$(git tag --list 'flowvault/[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
          tag="${rawtag#flowvault/}"
          if [ -z "$tag" ]; then tag="1.0.0"; fi
          echo "::set-output name=tag::$tag"
          echo "latest FlowVault stable tag is $tag"

      - name: Cache Gradle and wrapper
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}

      - name: Bump Version
        run: |
          chmod +x ./scripts/bump_version.sh
          ./scripts/bump_version.sh flowvault "${{ steps.previoustag.outputs.tag }}" "$(git rev-parse --short "$GITHUB_SHA")"

      - name: Commit changes
        run: |
          git config user.name ${{ github.actor }}
          git config user.email ${{ github.actor }}@users.noreply.gihub.com
          git add flowvault/build.gradle
          git commit -m "[AUTOMATED] FlowVault Private Release ${{ steps.previoustag.outputs.tag }}-dev.$(git rev-parse --short $GITHUB_SHA)"
          git push origin

      - name: Validate Gradle wrapper
        uses: gradle/wrapper-validation-action@v3
      - name: Publish package
        run: |
          chmod +x gradlew
          ./gradlew :flowvault:publish -Pdev=true
        env:
          USERNAME: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
