name: CI Checks

on: [pull_request]

jobs:
  check-commit-message:
    name: Check Commit Message
    runs-on: ubuntu-latest
    steps:
    - name: Check JIRA ID
      uses: gsactions/commit-message-checker@v1
      with:
        pattern: '(\[?[A-Z]{1,5}-[1-9][0-9]*)|[AUTOMATED].+$'
        flags: 'gm'
        excludeDescription: 'true'
        checkAllCommitMessages: 'true'
        accessToken: ${{ secrets.PAT_ACTIONS }}
        error: 'One of your your commit messages is not matching the format with JIRA ID Ex: ( SDK-123 commit message )'
  check-code-quality:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
    - name: Grant permissions to gradlew
      run: chmod +x gradlew
    - name: Run Android Linter (both SDKs)
      run: ./gradlew :skyvault:lint :flowvault:lint
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
    - name: Grant permissions to gradlew
      run: chmod +x gradlew
    - name: Build both SDKs
      run: ./gradlew :skyvault:build :flowvault:build
    - name: Run Tests (both SDKs via runOnGitHub aggregate)
      id: tests
      run: ./gradlew runOnGitHub