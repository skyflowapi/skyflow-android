name: FlowVault Public Release

on:
  push:
    tags: 'flowvault/[0-9]+.[0-9]+.[0-9]+'

jobs:
  build-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
          token: ${{ secrets.PAT_ACTIONS }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Derive version from tag
        id: version
        run: |
          # Tag looks like "flowvault/1.0.0" — strip the namespace prefix.
          version="${GITHUB_REF_NAME#flowvault/}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "FlowVault release version is $version"

      - name: Bump Version
        run: |
           chmod +x ./scripts/bump_version.sh
           ./scripts/bump_version.sh flowvault "${{ steps.version.outputs.version }}"

      - name: Commit changes
        run: |
           git config user.name ${{ github.actor }}
           git config user.email ${{ github.actor }}@users.noreply.gihub.com
           git add flowvault/build.gradle
           git commit -m "[AUTOMATED] FlowVault Public Release ${{ steps.version.outputs.version }}"
           git push origin

      - name: Validate Gradle wrapper
        uses: gradle/wrapper-validation-action@v3
      - name: Publish package
        run: |
           chmod +x gradlew
           ./gradlew :flowvault:publish
        env:
          USERNAME: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
