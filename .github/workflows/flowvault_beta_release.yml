name: FlowVault Public Beta Release

on:
  push:
    tags: "flowvault/*-beta.*"

jobs:
  build-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_ACTIONS }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Get the current branch
        id: check_step
        run: |
          raw=$(git branch -r --contains ${{ github.ref }})
          branch=${raw##*/}
          beta_branch="beta-release/$branch"
          echo "::set-output name=branch::$beta_branch"
          echo "Branch is $beta_branch."

      - name: Create local properties file
        run: |
          touch local.properties
          echo gpr.user=${{ github.actor }} >> local.properties
          echo gpr.key=${{ secrets.PAT_ACTIONS }} >> local.properties

      - name: Derive version from tag
        id: version
        run: |
          # Tag looks like "flowvault/1.0.0-beta.1" — strip the namespace prefix.
          version="${GITHUB_REF_NAME#flowvault/}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "FlowVault beta release version is $version"

      - name: Bump Version
        run: |
          chmod +x ./scripts/bump_version.sh
          ./scripts/bump_version.sh flowvault "${{ steps.version.outputs.version }}"

      - name: Commit changes
        run: |
          git config user.name ${{ github.actor }}
          git config user.email ${{ github.actor }}@users.noreply.gihub.com
          git branch -f ${{ steps.check_step.outputs.branch }} origin/${{ steps.check_step.outputs.branch }}
          git checkout ${{ steps.check_step.outputs.branch }}
          git add flowvault/build.gradle
          git commit -m "[AUTOMATED] FlowVault Public Beta Release ${{ steps.version.outputs.version }}"
          git push origin

      - name: Validate Gradle wrapper
        uses: gradle/wrapper-validation-action@v3
      - name: Publish package
        run: |
          chmod +x gradlew
          ./gradlew :flowvault:publish -Pbeta=true
        env:
          USERNAME: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
